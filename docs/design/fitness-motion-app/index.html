function render(){const query=search.value.trim().toLocaleLowerCase('vi'),list=data.filter(s=>s.role===role.value&&s.width===Number(device.value)&&s.theme===theme&&[s.title,s.path].join(' ').toLocaleLowerCase('vi').includes(query));grid.replaceChildren();document.getElementById('count').textContent=list.length+' màn hình';document.getElementById('empty').hidden=list.length!==0;for(const s of list){const card=document.createElement('article');card.className='screen'+(s.width===390?' mobile':'');const preview=document.createElement('button');preview.className='preview';preview.setAttribute('aria-label','Xem '+s.title);const img=document.createElement('img');img.src=s.image;img.alt=s.title;img.loading='lazy';preview.append(img);preview.onclick=()=>{document.getElementById('title').textContent=s.title;const full=document.getElementById('full');full.src=s.image;full.alt=s.title;dialog.showModal()};const caption=document.createElement('div');caption.className='caption';const title=document.createElement('h2');title.textContent=s.title;const route=document.createElement('p');route.textContent=s.path;const link=document.createElement('a');link.href='http://localhost:5310'+s.path;link.textContent='Mở màn hình';link.target='_blank';link.rel='noopener';caption.append(title,route,link);card.append(preview,caption);grid.append(card)}}
for(const element of [role,device,search])element.addEventListener(element===search?'input':'change',render);document.querySelectorAll('[data-theme]').forEach(button=>button.onclick=()=>{theme=button.dataset.theme;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()});document.getElementById('close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};render();
